<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motomundo · Prueba GA4</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 16px; color: #1a1a1a; background: #f7f7f8; }
  section { background: #fff; border: 1px solid #e3e3e6; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; }
  button { padding: .6rem 1.1rem; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; font-size: 1rem; }
  button:disabled { opacity: .6; cursor: wait; }
  select { padding: .45rem; border: 1px solid #ccc; border-radius: 6px; max-width: 100%; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  table { border-collapse: collapse; width: 100%; margin-top: .75rem; } td, th { border-bottom: 1px solid #eee; padding: .4rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; } tfoot td { font-weight: 600; border-top: 2px solid #ccc; }
  .ok { color: #1a7f37; } .err { color: #cf222e; } .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<h1>Motomundo · Prueba de conexión GA4</h1>
<section>
  <div class="row">
    <select id="property"><option value="properties/349018417">Motomundo - GA4</option></select>
    <button id="btn" onclick="probar()">Probar conexión</button>
  </div>
  <div id="out"></div>
</section>
<script>
const $ = id => document.getElementById(id);
const unwrap = r => r?.data?.data ?? r?.data ?? r;
const post = async (path, body) => {
  const j = await (await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })).json();
  if (j.error || j.successful === false) throw new Error(j.error || 'La consulta falló');
  return unwrap(j);
};
const fmt = (v, name) => name === 'engagementRate' ? (v * 100).toFixed(1) + '%' : Number(v).toLocaleString('es');
const LABELS = { sessions: 'Sesiones', activeUsers: 'Usuarios activos', engagedSessions: 'Sesiones con interacción', engagementRate: 'Tasa de interacción' };

// Rellena el selector con todas las propiedades (Motomundo - GA4 queda por defecto)
post('/api/properties').then(d => {
  const opts = (d.accountSummaries || []).flatMap(a => (a.propertySummaries || []).map(p =>
    `<option value="${p.property}" ${p.property === 'properties/349018417' ? 'selected' : ''}>${a.displayName} › ${p.displayName}</option>`));
  if (opts.length) $('property').innerHTML = opts.join('');
}).catch(() => {});

async function probar() {
  $('btn').disabled = true; $('out').innerHTML = '<p class="muted">Consultando GA4…</p>';
  try {
    const rep = await post('/api/report', { property: $('property').value });
    const mets = (rep.metricHeaders || []).map(h => h.name);
    const rows = rep.rows || [];
    const tot = (rep.totals || [])[0];
    $('out').innerHTML = `<p class="ok">● Conexión OK — últimos 7 días (sin hoy) por grupo predeterminado de canales de la sesión</p>
      <table><thead><tr><th>Canal</th>${mets.map(m => `<th>${LABELS[m] || m}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${r.dimensionValues[0].value}</td>${r.metricValues.map((v, i) => `<td>${fmt(v.value, mets[i])}</td>`).join('')}</tr>`).join('')}</tbody>
      ${tot ? `<tfoot><tr><td>Total</td>${tot.metricValues.map((v, i) => `<td>${fmt(v.value, mets[i])}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
  } catch (e) {
    $('out').innerHTML = `<p class="err">● Error de conexión: ${e.message}</p>`;
  } finally { $('btn').disabled = false; }
}
</script>
</body>
</html>
