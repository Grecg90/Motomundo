<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campañas UTM · Motomundo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#14161a; --muted:#6b7280; --line:#e6e8ec; --brand:#d71920; --soft:#f3f4f6; --bar:#1f2937; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  .wrap { max-width:1280px; margin:0 auto; padding:28px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .brand { display:flex; gap:12px; align-items:center; }
  .logo { width:40px; height:40px; border-radius:10px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; }
  h1 { margin:0; font-size:1.45rem; letter-spacing:-.02em; } .sub { color:var(--muted); font-size:.88rem; }
  .meta { text-align:right; color:var(--muted); font-size:.85rem; } .meta b { color:var(--ink); }

  /* selector de fecha */
  .dp { position:relative; display:inline-block; }
  .dp-btn { display:flex; gap:8px; align-items:center; font:inherit; font-size:.88rem; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; color:var(--ink); }
  .dp-btn:hover { border-color:#c7cbd1; } .dp-btn .car { color:var(--muted); }
  .dp-pop { position:absolute; right:0; top:calc(100% + 6px); z-index:20; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.14); display:flex; text-align:left; }
  .dp-pop[hidden] { display:none; }
  .dp-presets { display:flex; flex-direction:column; padding:8px; border-right:1px solid var(--line); min-width:150px; }
  .dp-presets button { font:inherit; font-size:.85rem; text-align:left; background:none; border:0; border-radius:6px; padding:7px 10px; cursor:pointer; color:var(--ink); }
  .dp-presets button:hover { background:var(--soft); } .dp-presets button.on { background:#fff5f5; color:var(--brand); font-weight:600; }
  .dp-cal { padding:10px 14px 12px; position:relative; }
  .dp-nav { position:absolute; left:10px; right:10px; top:8px; display:flex; justify-content:space-between; pointer-events:none; }
  .dp-nav button { pointer-events:auto; border:0; background:none; font-size:1.2rem; cursor:pointer; color:var(--muted); padding:0 6px; }
  .dp-months { display:flex; gap:18px; }
  .mo .mt { text-align:center; font-weight:600; font-size:.85rem; margin-bottom:6px; text-transform:capitalize; }
  .dg { display:grid; grid-template-columns:repeat(7, 32px); gap:2px 0; }
  .dg .wd { text-align:center; font-size:.7rem; color:var(--muted); padding:4px 0; }
  .dg button { height:30px; border:0; background:none; font:inherit; font-size:.8rem; cursor:pointer; color:var(--ink); border-radius:6px; }
  .dg button:hover:not(.off) { background:var(--soft); }
  .dg button.in { background:#fde8e9; border-radius:0; } .dg button.edge { background:var(--brand); color:#fff; font-weight:600; }
  .dg button.off { color:#d1d5db; cursor:default; }
  .dp-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px; font-size:.8rem; color:var(--muted); }
  .dp-apply { font:inherit; font-size:.82rem; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:6px 14px; cursor:pointer; }
  .dp-apply:disabled { opacity:.4; cursor:default; }
  /* variación vs periodo anterior */
  .dl { display:block; font-size:.72rem; font-weight:600; margin-top:1px; letter-spacing:0; }
  .kpi .dl { display:inline-block; font-size:.8rem; margin-left:8px; vertical-align:middle; padding:1px 7px; border-radius:999px; }
  .dl.up { color:#15803d; } .dl.dn { color:#be123c; } .dl.eq { color:var(--muted); }
  .kpi .dl.up { background:#dcfce7; } .kpi .dl.dn { background:#fde8e9; } .kpi .dl.eq { background:var(--soft); }
  .range { display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
  .range select, .range input { font:inherit; font-size:.85rem; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .l { font-size:.78rem; color:var(--muted); } .kpi .v { font-size:1.55rem; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .s { font-size:.78rem; color:var(--muted); margin-top:2px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tabs { display:flex; background:var(--soft); border-radius:8px; padding:3px; }
  .tabs button { border:0; background:none; padding:7px 14px; border-radius:6px; font:inherit; font-weight:500; color:var(--muted); cursor:pointer; }
  .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  input, select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input { flex:1; min-width:180px; }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:right; font-weight:500; color:var(--muted); font-size:.76rem; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th.l, td.l { text-align:left; }
  tr.grp { cursor:pointer; } tr.grp:hover { background:#fafafa; }
  tr.grp td.l b { font-weight:600; }
  .caret { display:inline-block; width:14px; color:var(--muted); transition:transform .15s; }
  tr.grp.open .caret { transform:rotate(90deg); }
  tr.det td { background:#fafbfc; font-size:.85rem; }
  tr.det td.l:first-child { padding-left:30px; width:60%; }
  .sub2 { color:var(--muted); font-size:.75rem; margin:2px 0 0 18px; }
  .utm { line-height:1.6; }
  .share { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .share .t { width:70px; height:6px; background:var(--soft); border-radius:3px; overflow:hidden; }
  .share .f { height:100%; background:var(--bar); }
  .tag { display:inline-block; padding:1px 7px; border-radius:5px; background:var(--soft); font-size:.78rem; margin:1px 2px 1px 0; white-space:nowrap; }
  .page { display:inline-block; min-width:140px; font-family:ui-monospace,Menlo,monospace; font-size:.8rem; color:#1d4ed8; word-break:break-all; }
  .term { color:var(--muted); font-size:.8rem; }
  .rate { display:inline-block; min-width:48px; padding:1px 7px; border-radius:999px; font-size:.76rem; font-weight:600; text-align:center; }
  .hi { background:#dcfce7; color:#166534; } .mid { background:var(--soft); color:#374151; } .lo { background:#fde8e9; color:#9f1239; }
  .ke { font-weight:600; } .ke.z { color:#c0c4cc; font-weight:400; }
  .table-wrap { overflow-x:auto; }
  .nm { display:flex; gap:4px; align-items:baseline; } .nm b, .nm .page { overflow-wrap:anywhere; } td:first-child { min-width:260px; } td .term { overflow-wrap:anywhere; }
  .share .t { width:48px; }
  .filters { display:grid; grid-template-columns:repeat(7,1fr) auto; gap:8px; margin-bottom:14px; align-items:end; }
  .filters label { display:flex; flex-direction:column; gap:4px; font-size:.74rem; color:var(--muted); font-weight:500; min-width:0; }
  .filters select { width:100%; text-overflow:ellipsis; }
  .filters select.on { border-color:var(--brand); background:#fff5f5; color:#9f1239; font-weight:500; }
  .chk { display:flex; gap:6px; align-items:center; color:var(--ink); white-space:nowrap; } .chk input { min-width:0; flex:none; }
  .utm { display:block; font-family:ui-monospace,Menlo,monospace; font-size:.72rem; color:var(--muted); margin-top:4px; overflow-wrap:anywhere; }
  .utm i { font-style:normal; color:#9ca3af; } .utm b { font-weight:500; color:#374151; }
  .lnk { text-decoration:none; } .lnk:hover b, .lnk:hover .host { text-decoration:underline; }
  .host { color:#1d4ed8; font-weight:600; }
  .acts { display:flex; gap:6px; margin-top:4px; align-items:center; } .acts .copy { margin:0; text-decoration:none; }
  .bad { display:inline-block; background:#fde8e9; color:#9f1239; border-radius:5px; font-size:.72rem; font-weight:600; padding:1px 7px; margin-left:6px; white-space:nowrap; }
  .okb { display:inline-block; background:#dcfce7; color:#166534; border-radius:5px; font-size:.72rem; font-weight:600; padding:1px 7px; margin-left:6px; }
  .issues { margin:6px 0 0; padding:0; list-style:none; font-size:.76rem; }
  .issues li { color:#9f1239; } .issues li b { font-weight:600; }
  .issues li.warn { color:#92400e; }
  .wrn { display:inline-block; background:#fef3c7; color:#92400e; border-radius:5px; font-size:.72rem; font-weight:600; padding:1px 7px; margin-left:6px; white-space:nowrap; }
  tr.det.warn td:first-child { box-shadow:inset 3px 0 0 #f59e0b; }
  tr.det.err td:first-child { box-shadow:inset 3px 0 0 #e11d48; }
  details.guide { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; }
  details.guide summary { cursor:pointer; padding:14px 18px; font-weight:600; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  details.guide summary::after { content:'Mostrar ▾'; color:var(--muted); font-weight:400; font-size:.8rem; }
  details.guide[open] summary::after { content:'Ocultar ▴'; }
  .gbody { padding:0 18px 18px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .rules { display:grid; gap:10px; }
  .rule { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .rule .k { font-family:ui-monospace,Menlo,monospace; font-size:.75rem; color:var(--muted); }
  .rule h4 { margin:0 0 4px; font-size:.9rem; } .rule p { margin:0; font-size:.8rem; color:#374151; }
  .rule code { background:var(--soft); border-radius:4px; padding:0 4px; font-size:.78rem; }
  .builder { display:grid; gap:8px; align-content:start; }
  .builder label { display:grid; gap:3px; font-size:.75rem; color:var(--muted); font-weight:500; }
  .builder input, .builder select { min-width:0; width:100%; }
  .out { background:#111827; color:#e5e7eb; border-radius:8px; padding:10px 12px; font-family:ui-monospace,Menlo,monospace; font-size:.76rem; overflow-wrap:anywhere; min-height:44px; }
  .nopage { font-size:.72rem; color:#9f1239; }
  .canales { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .cn { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; text-align:left; font:inherit; color:inherit; }
  .cn:hover { border-color:#c7cbd1; } .cn.on { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand) inset; }
  .cn .h { display:flex; justify-content:space-between; align-items:baseline; } .cn .h b { font-size:1rem; } .cn .h span { color:var(--muted); font-size:.75rem; }
  .cn .d { color:var(--muted); font-size:.75rem; margin:2px 0 10px; }
  .cn { min-width:0; } .cn .nums { display:flex; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums; } .cn .nums div { font-size:.72rem; color:var(--muted); } .cn .nums b { display:block; font-size:1.1rem; color:var(--ink); }
  .copy { border:1px solid var(--line); background:#fff; border-radius:5px; font-size:.7rem; padding:1px 6px; cursor:pointer; margin-left:6px; color:var(--muted); }
  .ev { font-weight:700; } .ev.z { color:#c0c4cc; font-weight:400; }
  th.ev1, th.ev2 { color:var(--ink); }
  .clear { border:0; background:none; color:var(--brand); font:inherit; font-weight:500; cursor:pointer; padding:8px 4px; white-space:nowrap; }
  .clear:disabled { color:#c0c4cc; cursor:default; }
  .count { color:var(--muted); font-size:.8rem; margin:-6px 0 10px; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  footer { color:var(--muted); font-size:.78rem; text-align:center; margin-top:20px; }
  @media (max-width:820px) { .dp-pop { position:fixed; left:8px; right:8px; top:70px; flex-direction:column; } .dp-presets { flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line); } .dp-months { flex-direction:column; } .dg { grid-template-columns:repeat(7, 1fr); } .gbody { grid-template-columns:1fr; } .canales { grid-template-columns:1fr 1fr; } .filters { grid-template-columns:1fr 1fr; } .kpis { grid-template-columns:repeat(2,1fr); } .table-wrap { overflow-x:auto; } .meta { text-align:left; } table { min-width:760px; } }
  @media print { .toolbar, .filters { display:none; } tr.det { display:table-row !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">M</div>
      <div><h1>Seguimiento de campañas (UTM)</h1><div class="sub">Qué UTM se usó, a dónde llevó y cuántas cotizaciones generó</div></div></div>
    <div class="meta">
      <div class="dp">
        <button class="dp-btn" id="dp_btn"><span class="ic">📅</span><span id="dp_label"></span><span class="car">▾</span></button>
        <div class="dp-pop" id="dp_pop" hidden>
          <div class="dp-presets" id="dp_presets"></div>
          <div class="dp-cal">
            <div class="dp-nav"><button id="dp_prevm">‹</button><button id="dp_nextm">›</button></div>
            <div class="dp-months" id="dp_months"></div>
            <div class="dp-foot"><span id="dp_sel"></span><button id="dp_apply" class="dp-apply">Aplicar</button></div>
          </div>
        </div>
      </div>
      <div style="margin-top:6px">Propiedad: <b id="prop"></b> · <span id="period"></span></div>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="canales" id="canales"></div>

  <details class="guide" id="guide">
    <summary>Cómo construir una UTM</summary>
    <div class="gbody">
      <div class="rules" id="rules"></div>
      <div class="builder">
        <label>URL de destino<input id="b_url" value="https://www.motomundohn.com/cotizar-en-linea"></label>
        <label>Fuente (utm_source)<input id="b_s" placeholder="Meta, Google, Base Clientes Claro…" value="Meta"></label>
        <label>Medio (utm_medium)<select id="b_m"></select></label>
        <label>Campaña (utm_campaign)<input id="b_c" placeholder="Genesis TacticaComercial Leads Centro"></label>
        <label>Término (utm_term, opcional)<input id="b_t" placeholder="Centro Tegucigalpa"></label>
        <label>Contenido (utm_content, opcional)<input id="b_x" placeholder="TTPremium_Zx-200l"></label>
        <div class="muted" style="font-size:.74rem">Los espacios se convierten en "_", se quitan tildes y cada palabra empieza en mayúscula.</div>
        <div class="out" id="b_out"></div>
        <ul class="issues" id="b_issues"></ul>
        <div><button class="copy" id="b_copy">copiar link</button></div>
      </div>
    </div>
  </details>

  <div class="card">
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button data-v="g">Canal</button>
        <button data-v="c" class="on">Campaña</button>
        <button data-v="s">Fuente</button>
        <button data-v="m">Medio</button>
        <button data-v="t">Término</button>
        <button data-v="x">Contenido (anuncio)</button>
        <button data-v="p">Página de destino</button>
      </div>
      <input id="q" placeholder="Buscar en todo…">
      <label class="chk"><input type="checkbox" id="only"> Solo con cotizaciones</label>
      <select id="onlyBad"><option value="">Estado UTM: todas</option><option value="err">✕ Mal construidas</option><option value="warn">⚠ Con advertencias</option><option value="ok">✓ Correctas</option></select>
    </div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div class="table-wrap"><table id="tbl"></table></div>
  </div>

  <footer>Fuente: Google Analytics 4 → Supabase · solo tráfico con utm_campaign · <span id="gen"></span></footer>
</div>

<script>
// ===== DATOS: se leen de Supabase vía /api/data (se sincronizan desde GA4 cada día a las 8:00 a.m.) =====
const REPORT = { property: 'Motomundo - GA4', minDate: '', maxDate: '' };
let D = { s: [], r: [] }, CARGADO = { from: '', to: '' };
async function asegurarDatos(from, to) {
  if (CARGADO.from && from >= CARGADO.from && to <= CARGADO.to) return;
  const j = await (await fetch(`/api/data?from=${from}&to=${to}`)).json();
  if (j.error) throw new Error(j.error);
  D = j; CARGADO = { from, to };
}

const $ = id => document.getElementById(id);
const num = n => Math.round(n).toLocaleString('es-MX');
const pct = (n, d = 1) => (n * 100).toFixed(d) + '%';
const date = s => new Date(s + 'T12:00').toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
const rc = r => r >= .6 ? 'hi' : r < .4 ? 'lo' : 'mid';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Agrupación de canales (según fuente + medio)
const CANALES = ['Pauta', 'Directos', 'Redes', 'Otros'];
const CANAL_INFO = { Pauta:'Paid social / search · Meta', Directos:'SMS · WhatsApp · Email · QR', Redes:'Organic social', Otros:'Sin clasificar' };
function canal(s, m) {
  const t = `${s} ${m}`.toLowerCase();
  if (/sms|whats|wapp|e-?mail|\bmail\b|\bqr\b/.test(t)) return 'Directos';
  if (/paid|meta|cpc|ppc|\bads?\b/.test(t)) return 'Pauta';
  if (/organic|social|facebook|instagram|tiktok|\bfb\b|\big\b/.test(t)) return 'Redes';
  return 'Otros';
}

// ===== ESTÁNDAR DE UTM (editar aquí las reglas) =====
const STD = {
  // Medio: siempre de esta lista. "referral" NO es un medio (es un canal que asigna GA4).
  medios: ['paid_social', 'paid_search', 'paid_video', 'organic_social', 'sms', 'whatsapp', 'email', 'qr'],
};
const RULES = [
  { f:'utm_source', n:'Fuente', req:true, d:'Quién envía el tráfico: la plataforma o la base de datos. Palabras unidas con "_" y cada una con la primera letra en mayúscula.', ej:['Meta', 'Google', 'Base_Clientes_Claro'] },
  { f:'utm_medium', n:'Medio', req:true, d:'Tipo de canal. Siempre uno de la lista.', ej: STD.medios },
  { f:'utm_campaign', n:'Campaña', req:true, d:'Palabras unidas con "_" (el constructor lo agrega solo) y cada una con la primera letra en mayúscula. Sin tildes.', ej:['Genesis_TacticaComercial_Leads_Centro', 'Mi_Primer_Credito'] },
  { f:'utm_term', n:'Término', req:false, d:'<b>Opcional</b> (los directos normalmente no lo usan). Si se usa: mismo formato que la campaña.', ej:['Centro_Tegucigalpa', 'Norte_San_Pedro_Sula'] },
];
const notSet = v => !v || v.startsWith('(');
// Nivel: 'err' = mal construida (rojo) · 'warn' = advertencia (amarillo)
// Formato: palabras con "_" y primera letra en mayúscula. Un "_" al final se acepta.
const fmtIssues = v => [
  / /.test(v) && 'tiene espacios (usar "_")', /[áéíóúÁÉÍÓÚ]/.test(v) && 'tiene tildes',
  /__/.test(v) && 'tiene "__" doble', /^_/.test(v) && 'empieza con "_"',
  (w => w.length && `primera letra en minúscula: ${w.slice(0, 3).map(x => '"' + x + '"').join(', ')}${w.length > 3 ? '…' : ''}`)
    (v.split(/[_\s-]+/).filter(x => /^[a-zñ]/.test(x))),
].filter(Boolean);
function validar({ s, m, c, t }) {
  const out = [], add = (f, msg, lvl) => out.push({ f, m: msg, lvl });
  const fmt = (f, v) => fmtIssues(v).forEach(x => add(f, x, 'warn'));
  if (notSet(s)) add('Fuente', 'falta utm_source', 'err'); else fmt('Fuente', s);
  if (notSet(m)) add('Medio', 'falta utm_medium', 'err');
  else if (!STD.medios.includes(m)) {
    const lo = m.toLowerCase(), hit = STD.medios.find(x => lo === x || lo.includes(x));
    if (hit) add('Medio', `"${m}" debería escribirse exactamente "${hit}"`, 'warn');
    else add('Medio', `"${m}" no es un medio válido (${STD.medios.join(', ')})`, 'err');
  }
  if (notSet(c)) add('Campaña', 'falta utm_campaign', 'err'); else fmt('Campaña', c);
  if (!notSet(t)) fmt('Término', t);
  return out;
}
const nivel = iss => iss.some(i => i.lvl === 'err') ? 'err' : iss.length ? 'warn' : 'ok';
// Constructor: convierte "base clientes claro" en "Base_Clientes_Claro"
const normalizar = v => v.trim().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .split(/[\s_]+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join('_');
const issuesHtml = arr => `<ul class="issues">${arr.map(i => `<li class="${i.lvl}">${i.lvl === 'err' ? '✕' : '⚠'} <b>${i.f}:</b> ${esc(i.m)}</li>`).join('')}</ul>`;
const BADGE = { err: n => `<span class="bad">✕ Mal construida</span>`, warn: n => `<span class="wrn">⚠ Advertencias · ${n}</span>`, ok: () => `<span class="okb">✓ Correcta</span>` };
// Suma los datos diarios del rango elegido por UTM (campaña+fuente+medio+término+contenido+página)
// Nota: en la muestra los usuarios se suman por día; en Vercel GA4 los devuelve exactos para el rango.
let R = [], P = null;   // R = periodo elegido · P = periodo anterior (mismo largo, justo antes)
function agg(from, to) {
  const T = D.s, M = new Map();
  for (const [d, c, s, m, t, x, h, p, u, e1, e2] of D.r) {
    if (d < from || d > to) continue;
    const k = [c, s, m, t, x, p].join('|'); let r = M.get(k);
    if (!r) { const v = i => T[i] || '(not set)'; r = { k, c:v(c), s:v(s), m:v(m), t:v(t), x:v(x), h:T[h], p:v(p), u:0, e1:0, e2:0 }; M.set(k, r); }
    r.u += u; r.e1 += e1; r.e2 += e2;
  }
  return [...M.values()].map(r => { r.g = canal(r.s, r.m); r.iss = validar(r); r.lv = nivel(r.iss); return r; });
}
function cargarRango(from, to, pFrom, pTo) {
  R = agg(from, to).filter(r => r.u >= 5 || r.e1 || r.e2);
  P = pFrom >= REPORT.minDate ? agg(pFrom, pTo) : null;   // sin datos suficientes → no se compara
}
// Variación vs periodo anterior
function dl(cur, prev) {
  if (!P) return '';
  if (!prev && !cur) return '';
  if (!prev) return '<span class="dl up">nuevo</span>';
  const v = (cur - prev) / prev;
  if (Math.abs(v) < .005) return '<span class="dl eq">= 0%</span>';
  return `<span class="dl ${v > 0 ? 'up' : 'dn'}">${v > 0 ? '▲' : '▼'} ${Math.abs(v * 100).toFixed(Math.abs(v) < .1 ? 1 : 0)}%</span>`;
}
const DIMS = { g:'Canal', c:'Campaña', s:'Fuente', m:'Medio', t:'Término', x:'Contenido', p:'Página de destino' };
const ORDER = ['g','c','s','m','t','x','p'];
const EV1 = 'Cotiza_Producto', EV2 = 'Cotización_Crédito';

function group(rows, key) {
  const g = new Map();
  for (const r of rows) {
    const k = r[key]; const a = g.get(k) || { key:k, u:0, e1:0, e2:0, rows:[] };
    a.u += r.u; a.e1 += r.e1; a.e2 += r.e2; a.rows.push(r); g.set(k, a);
  }
  return [...g.values()].sort((x, y) => (y.e1 + y.e2) - (x.e1 + x.e2) || y.u - x.u);
}
const uniq = (rows, f) => [...new Set(rows.map(f))];
const fmtDim = (d, v) => d === 'p' ? `<span class="page">${esc(v)}</span>` : d === 't' || d === 'x' ? `<span class="term">${esc(v)}</span>` : esc(v);
const tags = (d, arr) => arr.length === 1 ? fmtDim(d, arr[0])
  : arr.slice(0, 2).map(x => `<span class="tag">${esc(x)}</span>`).join('') + (arr.length > 2 ? `<span class="tag">+${arr.length - 2}</span>` : '');
const ev = (n, p) => `<td class="ev ${n ? '' : 'z'}">${n ? num(n) : '—'}${dl(n, p)}</td>`;
const metrics = (a, p = { u:0, e1:0, e2:0 }) => `<td>${num(a.u)}${dl(a.u, p.u)}</td>${ev(a.e1, p.e1)}${ev(a.e2, p.e2)}${ev(a.e1 + a.e2, p.e1 + p.e2)}`;
const MH = `<th>Usuarios</th><th class="ev1">${EV1}</th><th class="ev2">${EV2}</th><th>Total</th>`;
// Reconstruye el link completo al que apunta cada UTM (dominio + página de destino + parámetros)
const utmParts = r => [['utm_source', r.s], ['utm_medium', r.m], ['utm_campaign', r.c], ['utm_term', r.t], ['utm_content', r.x]]
  .filter(([, v]) => v && !v.startsWith('('));
const qs = r => utmParts(r).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
const hasPage = r => r.p.startsWith('/');
const link = r => hasPage(r) ? `https://${r.h}${r.p}${r.p.includes('?') ? '&' : '?'}${qs(r)}` : '';
const utmHtml = r => {
  const st = BADGE[r.lv](r.iss.length);
  return utmLink(r) + st + (r.iss.length ? issuesHtml(r.iss) : '');
};
const utmLink = r => {
  const pretty = utmParts(r).map(([k, v]) => `<i>${k}=</i><b>${esc(v)}</b>`).join('<i>&amp;</i>');
  return hasPage(r)
    ? `<a class="utm lnk" href="${esc(link(r))}" target="_blank" rel="noopener"><span class="host">${esc(r.h)}${esc(r.p)}</span><i>?</i>${pretty}</a>
       <span class="acts"><a class="copy" href="${esc(link(r))}" target="_blank" rel="noopener">abrir ↗</a><button class="copy" data-utm="${esc(link(r))}">copiar link</button></span>`
    : `<span class="utm">${pretty}</span><span class="acts"><span class="nopage">sin página de destino registrada</span><button class="copy" data-utm="${esc(qs(r))}">copiar UTM</button></span>`;
};

// ---- Filtros: un desplegable por dimensión; cada uno solo ofrece valores compatibles con los demás ----
const F = Object.fromEntries(ORDER.map(d => [d, '']));
$('filters').innerHTML = ORDER.map(d => `<label>${DIMS[d]}<select data-d="${d}"></select></label>`).join('')
  + '<button class="clear" id="clear">Limpiar filtros</button>';
const matches = (r, skip) => ORDER.every(d => d === skip || !F[d] || r[d] === F[d]);
function fillFilters() {
  for (const sel of $('filters').querySelectorAll('select')) {
    const d = sel.dataset.d;
    const opts = group(R.filter(r => matches(r, d)), d);
    sel.innerHTML = `<option value="">Todas (${opts.length})</option>` +
      opts.map(a => `<option value="${esc(a.key)}" ${F[d] && a.key === F[d] ? 'selected' : ''}>${esc(a.key)}${a.e1 + a.e2 ? ' · ' + num(a.e1 + a.e2) + ' cot.' : ''}</option>`).join('');
    sel.classList.toggle('on', !!F[d]);
  }
  $('clear').disabled = !ORDER.some(d => F[d]);
}
$('filters').onchange = e => { F[e.target.dataset.d] = e.target.value; update(); };
$('clear').onclick = () => { ORDER.forEach(d => F[d] = ''); $('q').value = ''; $('only').checked = false; $('onlyBad').value = ''; update(); };

// ---- Tabla: agrupa por la dimensión elegida; al desplegar muestra cada UTM usada ----
let view = 'c';
function draw() {
  const q = $('q').value.toLowerCase(), only = $('only').checked, onlyBad = $('onlyBad').value;
  const ok = r => matches(r) && (!only || r.e1 + r.e2) && (!onlyBad || r.lv === onlyBad) && (!q || ORDER.some(d => r[d].toLowerCase().includes(q)));
  const rows = R.filter(ok), prows = P ? P.filter(r => matches(r) && (!onlyBad || r.lv === onlyBad) && (!q || ORDER.some(d => r[d].toLowerCase().includes(q)))) : [];
  const PK = new Map(prows.map(r => [r.k, r]));
  const side = view === 'p' ? 'c' : 'p';   // segunda columna: página de destino (o campaña si agrupas por página)
  const G = group(rows, view), PG = new Map(group(prows, view).map(a => [a.key, a]));
  const t1 = rows.reduce((s, r) => s + r.e1, 0), t2 = rows.reduce((s, r) => s + r.e2, 0);
  $('count').textContent = `${G.length} resultado${G.length === 1 ? '' : 's'} · ${rows.length} UTMs · ${num(t1)} ${EV1} · ${num(t2)} ${EV2}`;
  $('tbl').innerHTML = `<thead><tr><th class="l">${DIMS[view]}</th><th class="l">${DIMS[side]}</th>${MH}</tr></thead><tbody>` +
    (G.length ? G.map((a, i) => `
      <tr class="grp" data-i="${i}"><td class="l"><div class="nm"><span class="caret">▸</span><b>${fmtDim(view, a.key)}</b></div>
          <div class="sub2">${a.rows.length} UTM${a.rows.length === 1 ? '' : 's'}${(e => e ? `<span class="bad">✕ ${e} mal construida${e === 1 ? '' : 's'}</span>` : '')(a.rows.filter(r => r.lv === 'err').length)}${(w => w ? `<span class="wrn">⚠ ${w} con advertencias</span>` : '')(a.rows.filter(r => r.lv === 'warn').length)}${a.rows.every(r => r.lv === 'ok') ? '<span class="okb">✓ todas correctas</span>' : ''}</div></td>
        <td class="l">${tags(side, uniq(a.rows, r => r[side]))}</td>${metrics(a, PG.get(a.key))}</tr>
      ${a.rows.map(r => `<tr class="det ${r.lv}" data-p="${i}" hidden><td class="l">${utmHtml(r)}</td><td class="l">${fmtDim(side, r[side])}</td>${metrics(r, PK.get(r.k))}</tr>`).join('')}`).join('')
    : `<tr><td colspan="6" class="empty">Sin resultados con estos filtros</td></tr>`) + '</tbody>';
}
function drawCanales() {
  $('canales').innerHTML = CANALES.map(g => {
    const rs = R.filter(r => r.g === g), sm = f => rs.reduce((a, r) => a + f(r), 0);
    const ps = P ? P.filter(r => r.g === g) : [], pm = f => ps.reduce((a, r) => a + f(r), 0);
    return `<button class="cn ${F.g === g ? 'on' : ''}" data-g="${g}"><div class="h"><b>${g}</b><span>${uniq(rs, r => r.c).length} campañas</span></div>
      <div class="d">${CANAL_INFO[g]}</div>
      <div class="nums">${[[r => r.e1, EV1], [r => r.e2, EV2], [r => r.u, 'Usuarios']].map(([f, l]) => `<div><b>${num(sm(f))}</b>${l}${dl(sm(f), pm(f))}</div>`).join('')}</div></button>`;
  }).join('');
}
$('canales').onclick = e => { const b = e.target.closest('.cn'); if (!b) return; F.g = F.g === b.dataset.g ? '' : b.dataset.g; update(); };
function update() { fillFilters(); drawCanales(); draw(); }
$('tbl').onclick = e => {
  const cp = e.target.closest('.copy');
  if (cp) { navigator.clipboard?.writeText(cp.dataset.utm); cp.textContent = 'copiado'; setTimeout(() => cp.textContent = 'copiar', 1200); return; }
  const tr = e.target.closest('tr.grp'); if (!tr) return;
  tr.classList.toggle('open');
  document.querySelectorAll(`tr.det[data-p="${tr.dataset.i}"]`).forEach(d => d.hidden = !tr.classList.contains('open'));
};
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('q').oninput = draw; $('only').onchange = draw; $('onlyBad').onchange = draw;

// Cabecera y KPIs
const sum = f => R.reduce((s, r) => s + f(r), 0);
$('prop').textContent = REPORT.property;
function drawKpis() {
  const ps = f => P ? P.reduce((s, r) => s + f(r), 0) : 0;
  const nc = rs => uniq(rs, r => r.c).length;
  $('kpis').innerHTML = [
    [EV1, sum(r => r.e1), ps(r => r.e1), 'veces accionado desde campañas'],
    [EV2, sum(r => r.e2), ps(r => r.e2), 'veces accionado desde campañas'],
    ['Usuarios con UTM', sum(r => r.u), ps(r => r.u), 'llegados por campañas'],
    ['Campañas', nc(R), P ? nc(P.filter(r => r.u >= 5 || r.e1 || r.e2)) : 0, `${nc(R.filter(r => r.e1 + r.e2))} con cotizaciones`],
    ['UTMs mal construidas', R.filter(r => r.lv === 'err').length, null, `${num(R.filter(r => r.lv === 'warn').length)} con advertencias · ${num(R.filter(r => r.lv === 'ok').length)} correctas de ${num(R.length)}`],
  ].map(([l, v, p, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${num(v)}${p === null ? '' : dl(v, p)}</div><div class="s">${s}</div></div>`).join('');
}

// ===== Selector de intervalo de tiempo (un solo control) =====
const iso = d => d.toISOString().slice(0, 10);
const addD = (s, n) => { const d = new Date(s + 'T12:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const days = (a, b) => Math.round((new Date(b + 'T12:00Z') - new Date(a + 'T12:00Z')) / 864e5);
let AYER = '';   // último día sincronizado (normalmente ayer)
const PRESETS = [
  ['ayer', 'Ayer', () => [AYER, AYER]],
  ['d7', 'Últimos 7 días', () => [addD(AYER, -6), AYER]],
  ['d14', 'Últimos 14 días', () => [addD(AYER, -13), AYER]],
  ['d30', 'Últimos 30 días', () => [addD(AYER, -29), AYER]],
  ['mes', 'Este mes', () => [AYER.slice(0, 8) + '01', AYER]],
  ['mesant', 'Mes pasado', () => { const f = addD(AYER.slice(0, 8) + '01', -1); return [f.slice(0, 8) + '01', f]; }],
];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let RANGO = { from:'', to:'', preset:'mes' }, sel = { a:'', b:'' }, calMonth = '';

async function aplicarRango(from, to, preset) {
  if (from > to) [from, to] = [to, from];
  RANGO = { from, to, preset };
  const n = days(from, to) + 1, pTo = addD(from, -1), pFrom = addD(pTo, -(n - 1));
  const name = PRESETS.find(p => p[0] === preset)?.[1];
  $('dp_label').innerHTML = `${name ? `<b>${name}</b> · ` : ''}${date(from)} – ${date(to)}`;
  $('period').textContent = pFrom >= REPORT.minDate ? `vs ${date(pFrom)} – ${date(pTo)}` : 'sin periodo anterior para comparar';
  $('dp_label').insertAdjacentHTML('beforeend', ' <span class="muted">· cargando…</span>');
  try { await asegurarDatos(pFrom < REPORT.minDate ? from : pFrom, to); }
  catch (e) { $('kpis').innerHTML = `<div class="kpi" style="grid-column:1/-1"><b class="err">Error al cargar datos:</b> ${esc(e.message)}</div>`; return; }
  $('dp_label').innerHTML = `${name ? `<b>${name}</b> · ` : ''}${date(from)} – ${date(to)}`;
  cargarRango(from, to, pFrom, pTo); drawKpis(); update();
}
function drawCal() {
  $('dp_presets').innerHTML = PRESETS.map(([k, l]) => `<button data-k="${k}" class="${RANGO.preset === k ? 'on' : ''}">${l}</button>`).join('');
  const month = ym => {
    const [y, m] = ym.split('-').map(Number), first = new Date(Date.UTC(y, m - 1, 1)), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const pad = (first.getUTCDay() + 6) % 7;   // semana empieza en lunes
    let h = `<div class="mo"><div class="mt">${MESES[m - 1]} ${y}</div><div class="dg">${['L','M','M','J','V','S','D'].map(x => `<span class="wd">${x}</span>`).join('')}`;
    h += '<span></span>'.repeat(pad);
    for (let d = 1; d <= n; d++) {
      const v = `${ym}-${String(d).padStart(2, '0')}`, b = sel.b || sel.a;
      const off = v < REPORT.minDate || v > REPORT.maxDate;
      const cls = [off && 'off', (v === sel.a || v === sel.b) && 'edge', sel.a && b && v > (sel.a < b ? sel.a : b) && v < (sel.a < b ? b : sel.a) && 'in'].filter(Boolean).join(' ');
      h += `<button data-d="${v}" class="${cls}" ${off ? 'disabled' : ''}>${d}</button>`;
    }
    return h + '</div></div>';
  };
  const prevM = (() => { const [y, m] = calMonth.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; })();
  $('dp_months').innerHTML = month(prevM) + month(calMonth);
  $('dp_sel').textContent = sel.a ? `${date(sel.a)} – ${sel.b ? date(sel.b) : 'elige el día final'}` : 'Elige el día inicial';
  $('dp_apply').disabled = !(sel.a && sel.b);
}
$('dp_btn').onclick = e => { e.stopPropagation(); const p = $('dp_pop'); p.hidden = !p.hidden;
  if (!p.hidden) { sel = { a:RANGO.from, b:RANGO.to }; calMonth = RANGO.to.slice(0, 7); drawCal(); } };
$('dp_pop').onclick = e => {
  e.stopPropagation();
  const pr = e.target.closest('[data-k]'), dd = e.target.closest('[data-d]');
  if (pr) { const [k, , f] = PRESETS.find(p => p[0] === pr.dataset.k); aplicarRango(...f(), k); $('dp_pop').hidden = true; }
  else if (dd) { const v = dd.dataset.d; if (!sel.a || sel.b) sel = { a:v, b:'' }; else sel.b = v; if (sel.b && sel.b < sel.a) sel = { a:sel.b, b:sel.a }; drawCal(); }
  else if (e.target.id === 'dp_prevm' || e.target.id === 'dp_nextm') {
    const [y, m] = calMonth.split('-').map(Number), n = new Date(Date.UTC(y, m - 1 + (e.target.id === 'dp_nextm' ? 1 : -1), 1));
    calMonth = iso(n).slice(0, 7); drawCal();
  }
  else if (e.target.id === 'dp_apply' && sel.a && sel.b) { aplicarRango(sel.a, sel.b, 'custom'); $('dp_pop').hidden = true; }
};
document.addEventListener('click', () => $('dp_pop').hidden = true);

// ===== Widget: guía + constructor de UTM =====
$('rules').innerHTML = RULES.map(r => `<div class="rule"><div class="k">${r.f} · ${r.req ? 'obligatorio' : 'opcional'}</div><h4>${r.n}</h4><p>${r.d}</p>
  <p style="margin-top:6px">${r.ej.map(x => `<code>${esc(x)}</code>`).join(' ')}</p></div>`).join('');
$('b_m').innerHTML = STD.medios.map(x => `<option>${x}</option>`).join('');
function build() {
  const v = id => $(id).value.trim();
  const r = { s:normalizar(v('b_s')), m:v('b_m'), c:normalizar(v('b_c')), t:normalizar(v('b_t')), x:normalizar(v('b_x')) };
  const iss = validar(r);
  const qs = [['utm_source', r.s], ['utm_medium', r.m], ['utm_campaign', r.c], ['utm_term', r.t], ['utm_content', r.x]]
    .filter(([, x]) => x).map(([k, x]) => k + '=' + encodeURIComponent(x)).join('&');
  const url = v('b_url'); const full = url ? url + (url.includes('?') ? '&' : '?') + qs : qs;
  $('b_out').textContent = full;
  $('b_issues').innerHTML = iss.length ? iss.map(i => `<li class="${i.lvl}">${i.lvl === 'err' ? '✕' : '⚠'} <b>${i.f}:</b> ${esc(i.m)}</li>`).join('') : '<li style="color:#166534">✓ La UTM cumple el estándar</li>';
  $('b_copy').dataset.utm = full;
}
['b_url','b_s','b_m','b_c','b_t','b_x'].forEach(id => $(id).oninput = build);
$('b_copy').onclick = e => { navigator.clipboard?.writeText(e.target.dataset.utm); e.target.textContent = 'copiado'; setTimeout(() => e.target.textContent = 'copiar link', 1200); };
build();
(async () => {
  try {
    const m = await (await fetch('/api/data?meta=1')).json();
    if (m.error || !m.maxDate) throw new Error(m.error || 'Todavía no hay datos sincronizados');
    REPORT.minDate = m.minDate; REPORT.maxDate = AYER = m.maxDate; calMonth = AYER.slice(0, 7);
    $('gen').textContent = m.lastSync ? 'datos actualizados el ' + new Date(m.lastSync).toLocaleString('es-MX') : '';
    aplicarRango(...PRESETS[4][2](), 'mes');
  } catch (e) { $('kpis').innerHTML = `<div class="kpi" style="grid-column:1/-1"><b class="err">Error:</b> ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
