<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte de canales · Motomundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #14161a; --muted: #6b7280; --line: #e6e8ec;
    --brand: #d71920; --brand-soft: #fde8e9; --bar: #1f2937; --bar-soft: #e5e7eb; --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .meta { text-align: right; font-size: .85rem; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .kpi .l { font-size: .8rem; color: var(--muted); }
  .kpi .v { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1rem; }
  .card .hint { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }

  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 140px 1fr 110px; gap: 12px; align-items: center; font-size: .9rem; }
  .track { height: 14px; background: var(--bar-soft); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 4px; }
  .bar-row.top .fill { background: var(--brand); }
  .bar-row .n { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row .n small { color: var(--muted); margin-left: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 500; color: var(--muted); font-size: .8rem; padding: 8px; border-bottom: 1px solid var(--line); }
  td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
  .rate { display: inline-block; min-width: 56px; padding: 2px 8px; border-radius: 999px; font-size: .8rem; font-weight: 600; text-align: center; }
  .hi { background: #dcfce7; color: #166534; } .mid { background: #f3f4f6; color: #374151; } .lo { background: var(--brand-soft); color: #9f1239; }

  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 24px; }

  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .bar-row { grid-template-columns: 100px 1fr 80px; }
    .bar-row .n small { display: none; }
    .table-wrap { overflow-x: auto; }
    .meta { text-align: left; }
  }
  @media print { body { background: #fff; } .card, .kpi { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>Reporte de canales</h1>
        <div class="sub">Grupo predeterminado de canales de la sesión</div>
      </div>
    </div>
    <div class="meta">
      <div>Propiedad: <b id="prop"></b></div>
      <div>Periodo: <b id="period"></b></div>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>Sesiones por canal</h2>
    <div class="hint">Participación sobre el total de sesiones del periodo</div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="card">
    <h2>Detalle por canal</h2>
    <div class="hint">Tasa de interacción: verde ≥ 60 %, rojo &lt; 40 %</div>
    <div class="table-wrap"><table id="tbl"></table></div>
  </div>

  <footer>Fuente: Google Analytics 4 · generado el <span id="gen"></span></footer>
</div>

<script>
// ===== DATOS DE MUESTRA (reales, Motomundo - GA4). En Vercel esto vendrá de /api/report =====
const REPORT = {
  property: 'Motomundo - GA4',
  startDate: '2026-09-17', endDate: '2026-09-23',
  rows: [
    ['Paid Social', 47195, 36092, 16989, 0.35997],
    ['Organic Search', 43815, 21277, 28410, 0.64841],
    ['Direct', 6886, 5037, 3747, 0.54415],
    ['Organic Social', 1813, 1554, 947, 0.52234],
    ['Referral', 877, 352, 586, 0.66819],
    ['SMS', 523, 374, 260, 0.49713],
    ['Unassigned', 343, 265, 103, 0.30029],
    ['Paid Search', 239, 100, 126, 0.52720],
    ['AI Assistant', 94, 83, 60, 0.63830],
    ['Paid Other', 18, 11, 10, 0.55556],
    ['Cross-network', 10, 6, 3, 0.3],
    ['Display', 10, 8, 4, 0.4],
    ['Email', 1, 1, 0, 0],
  ],
  totals: [101646, 64219, 51288, 0.50457],
};

// ===== RENDER =====
const $ = id => document.getElementById(id);
const num = n => Number(n).toLocaleString('es-MX');
const pct = (n, d = 1) => (n * 100).toFixed(d) + '%';
const date = s => new Date(s + 'T12:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
const rateClass = r => r >= 0.6 ? 'hi' : r < 0.4 ? 'lo' : 'mid';

function render(R) {
  const [S, U, E, ER] = R.totals;
  $('prop').textContent = R.property;
  $('period').textContent = `${date(R.startDate)} – ${date(R.endDate)}`;
  $('gen').textContent = new Date().toLocaleString('es-MX');

  $('kpis').innerHTML = [
    ['Sesiones', num(S)], ['Usuarios activos', num(U)],
    ['Sesiones con interacción', num(E)], ['Tasa de interacción', pct(ER)],
  ].map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');

  const max = R.rows[0][1];
  $('bars').innerHTML = R.rows.map(([c, s], i) => `
    <div class="bar-row ${i === 0 ? 'top' : ''}">
      <div>${c}</div>
      <div class="track"><div class="fill" style="width:${Math.max(s / max * 100, .5)}%"></div></div>
      <div class="n">${num(s)}<small>${pct(s / S)}</small></div>
    </div>`).join('');

  $('tbl').innerHTML = `
    <thead><tr><th>Canal</th><th>Sesiones</th><th>% del total</th><th>Usuarios activos</th><th>Con interacción</th><th>Tasa de interacción</th></tr></thead>
    <tbody>${R.rows.map(([c, s, u, e, r]) => `
      <tr><td>${c}</td><td>${num(s)}</td><td>${pct(s / S)}</td><td>${num(u)}</td><td>${num(e)}</td>
      <td><span class="rate ${rateClass(r)}">${pct(r)}</span></td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${num(S)}</td><td>100%</td><td>${num(U)}</td><td>${num(E)}</td><td>${pct(ER)}</td></tr></tfoot>`;
}
render(REPORT);
</script>
</body>
</html>
