  * { box-sizing:border-box; }

  .meta { text-align:right; color:var(--muted); font-size:.85rem; } .meta b { color:var(--ink); }

  .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  input, select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input { flex:1; min-width:180px; }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:right; font-weight:500; color:var(--muted); font-size:.76rem; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th.l, td.l { text-align:left; }
  tr.grp { cursor:pointer; } tr.grp:hover { background:#fafafa; }
  tr.grp td.l b { font-weight:600; }
  .caret { display:inline-block; width:14px; color:var(--muted); transition:transform .15s; }
  tr.grp.open .caret { transform:rotate(90deg); }
  tr.det td { background:#fafbfc; font-size:.85rem; }
  tr.det td.l:first-child { padding-left:30px; }
  .share { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .share .t { width:70px; height:6px; background:var(--soft); border-radius:3px; overflow:hidden; }
  .share .f { height:100%; background:var(--bar); }
  .tag { display:inline-block; padding:1px 7px; border-radius:5px; background:var(--soft); font-size:.78rem; margin:1px 2px 1px 0; white-space:nowrap; }
  .page { display:inline-block; min-width:140px; font-family:ui-monospace,Menlo,monospace; font-size:.8rem; color:#1d4ed8; word-break:break-all; }
  .term { color:var(--muted); font-size:.8rem; }
  .rate { display:inline-block; min-width:48px; padding:1px 7px; border-radius:999px; font-size:.76rem; font-weight:600; text-align:center; }
  .hi { background:#dcfce7; color:#166534; } .mid { background:var(--soft); color:#374151; } .lo { background:#fde8e9; color:#9f1239; }
  .ke { font-weight:600; } .ke.z { color:#c0c4cc; font-weight:400; }
  .table-wrap { overflow-x:auto; }
  .nm { display:flex; gap:4px; align-items:baseline; } .nm b, .nm .page { overflow-wrap:anywhere; } td:first-child { min-width:220px; }
  .share .t { width:48px; }
  .filters { display:grid; grid-template-columns:repeat(5,1fr) auto; gap:8px; margin-bottom:14px; align-items:end; }
  .filters label { display:flex; flex-direction:column; gap:4px; font-size:.74rem; color:var(--muted); font-weight:500; min-width:0; }
  .filters select { width:100%; text-overflow:ellipsis; }
  .filters select.on { border-color:var(--brand); background:#fff5f5; color:#9f1239; font-weight:500; }
  .clear { border:0; background:none; color:var(--brand); font:inherit; font-weight:500; cursor:pointer; padding:8px 4px; white-space:nowrap; }
  .clear:disabled { color:#c0c4cc; cursor:default; }
  .count { color:var(--muted); font-size:.8rem; margin:-6px 0 10px; }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  footer { color:var(--muted); font-size:.78rem; text-align:center; margin-top:20px; }

};

const $ = id => document.getElementById(id);
const num = n => Math.round(n).toLocaleString('es-MX');
const pct = (n, d = 1) => (n * 100).toFixed(d) + '%';
const date = s => new Date(s + 'T12:00').toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
const rc = r => r >= .6 ? 'hi' : r < .4 ? 'lo' : 'mid';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = REPORT.rows.map(([c,s,m,t,p,se,u,er,k]) => ({c,s,m,t,p,se,u,er,k}));
const DIMS = { c:'Campaña', s:'Fuente', m:'Medio', t:'Término', p:'Página de destino' };
const ORDER = ['c','s','m','t','p'];

// Agrupa filas sumando métricas; la tasa se pondera por sesiones
function group(rows, key) {
  const g = new Map();
  for (const r of rows) {
    const k = r[key]; const a = g.get(k) || { key:k, se:0, u:0, eng:0, k:0, rows:[] };
    a.se += r.se; a.u += r.u; a.eng += r.er * r.se; a.k += r.k; a.rows.push(r); g.set(k, a);
  }
  return [...g.values()].map(a => ({ ...a, er: a.eng / a.se })).sort((x, y) => y.se - x.se);
}
const uniq = (rows, f) => [...new Set(rows.map(f))];
const fmtDim = (d, v) => d === 'p' ? `<span class="page">${esc(v)}</span>` : d === 't' ? `<span class="term">${esc(v)}</span>` : esc(v);
const tags = (d, arr) => arr.length === 1 ? fmtDim(d, arr[0])
  : arr.slice(0, 2).map(x => `<span class="tag">${esc(x)}</span>`).join('') + (arr.length > 2 ? `<span class="tag">+${arr.length - 2}</span>` : '');
const metrics = (a, tot) => `
  <td><div class="share">${num(a.se)}<div class="t"><div class="f" style="width:${a.se / tot * 100}%"></div></div></div></td>
  <td>${num(a.u)}</td><td><span class="rate ${rc(a.er)}">${pct(a.er, 0)}</span></td>
  <td class="ke ${a.k ? '' : 'z'}">${num(a.k)}</td>`;

// ---- Filtros: un desplegable por dimensión; cada uno solo ofrece valores compatibles con los demás ----
const F = { c:'', s:'', m:'', t:'', p:'' };
$('filters').innerHTML = ORDER.map(d => `<label>${DIMS[d]}<select data-d="${d}"></select></label>`).join('')
  + '<button class="clear" id="clear">Limpiar filtros</button>';
const matches = (r, skip) => ORDER.every(d => d === skip || !F[d] || r[d] === F[d]);
function fillFilters() {
  for (const sel of $('filters').querySelectorAll('select')) {
    const d = sel.dataset.d;
    const opts = group(R.filter(r => matches(r, d)), d);
    sel.innerHTML = `<option value="">Todas (${opts.length})</option>` +
      opts.map(a => `<option value="${esc(a.key)}" ${a.key === F[d] ? 'selected' : ''}>${esc(a.key)} · ${num(a.se)}</option>`).join('');
    sel.classList.toggle('on', !!F[d]);
  }
  $('clear').disabled = !ORDER.some(d => F[d]);
}
$('filters').onchange = e => { F[e.target.dataset.d] = e.target.value; update(); };
$('clear').onclick = () => { ORDER.forEach(d => F[d] = ''); $('q').value = ''; update(); };

// ---- Tabla: agrupa por la dimensión elegida; al desplegar muestra el desglose completo ----
let view = 'c';
function draw() {
  const q = $('q').value.toLowerCase();
  const rows = R.filter(r => matches(r) && (!q || ORDER.some(d => r[d].toLowerCase().includes(q))));
  const others = ORDER.filter(d => d !== view);
  const G = group(rows, view), tot = rows.reduce((s, r) => s + r.se, 0) || 1;
  $('count').textContent = `${G.length} ${DIMS[view].toLowerCase()}${G.length === 1 ? '' : 's'} · ${rows.length} combinaciones · ${num(tot)} sesiones`;
  $('tbl').innerHTML = `<thead><tr><th class="l">${DIMS[view]}</th>${others.map(d => `<th class="l">${DIMS[d]}</th>`).join('')}
      <th>Sesiones</th><th>Usuarios</th><th>Interacción</th><th>Eventos clave</th></tr></thead><tbody>` +
    (G.length ? G.map((a, i) => `
      <tr class="grp" data-i="${i}"><td class="l"><div class="nm"><span class="caret">▸</span><b>${fmtDim(view, a.key)}</b></div></td>
        ${others.map(d => `<td class="l">${tags(d, uniq(a.rows, r => r[d]))}</td>`).join('')}${metrics(a, tot)}</tr>
      ${a.rows.map(r => `<tr class="det" data-p="${i}" hidden><td class="l"></td>${others.map(d => `<td class="l">${fmtDim(d, r[d])}</td>`).join('')}${metrics(r, tot)}</tr>`).join('')}`).join('')
    : `<tr><td colspan="9" class="empty">Sin resultados con estos filtros</td></tr>`) + '</tbody>';
}
function update() { fillFilters(); draw(); }
$('tbl').onclick = e => {
  const tr = e.target.closest('tr.grp'); if (!tr) return;
  tr.classList.toggle('open');
  document.querySelectorAll(`tr.det[data-p="${tr.dataset.i}"]`).forEach(d => d.hidden = !tr.classList.contains('open'));
};
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('q').oninput = draw;

// Cabecera y KPIs
const S = R.reduce((s, r) => s + r.se, 0), U = R.reduce((s, r) => s + r.u, 0);
const ER = R.reduce((s, r) => s + r.er * r.se, 0) / S, K = R.reduce((s, r) => s + r.k, 0);
$('prop').textContent = REPORT.property;
$('period').textContent = `${date(REPORT.startDate)} – ${date(REPORT.endDate)}`;
$('gen').textContent = new Date().toLocaleString('es-MX');
$('kpis').innerHTML = [
  ['Sesiones con UTM', num(S), `${pct(S / REPORT.totalSessionsSite)} del tráfico total`],
  ['Usuarios', num(U), 'llegados por campañas'],
  ['Tasa de interacción', pct(ER), 'promedio ponderado'],
  ['Eventos clave', num(K), 'conversiones de campañas'],
  ['Campañas activas', uniq(R, r => r.c).length, `${uniq(R, r => r.p).length} páginas de destino`],
].map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
update();
</script>
